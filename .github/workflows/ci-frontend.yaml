name: CI Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, jimmy-pruebas ]
    paths:
      - 'frontend/**'

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20  # Vite funciona de forma excelente con Node 20
        cache: 'npm'
        cache-dependency-path: 'frontend/package.json'

    - name: Instalar Dependencias del Frontend
      run: |
        cd frontend
        npm install

    - name: Validar Calidad de Código (Linter)
      run: |
        cd frontend
        npm run lint --if-present

    - name: Compilar Proyecto (Build de Producción)
      run: |
        cd frontend
        npm run build